name: muhurtham_app
description: Muhurtham - Auspicious Timing Finder App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management (MVVM)
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3+1
  
  # Local Storage
  shared_preferences: ^2.2.3

  # UI & Theming
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  pin_code_fields: ^8.0.1
  shimmer: ^3.0.0
  
  # Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
