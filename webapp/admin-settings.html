<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20261108">
  <link rel="stylesheet" href="css/portal.css">
  <title>Settings · Muhurtham</title>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <nav class="app-shell__nav portal-nav" aria-label="Primary navigation">
    <a class="app-shell__brand" href="/">ముహూర్తం</a>
    <div class="app-shell__links"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="langEn" onclick="setLang('en')">English</button>
      <button class="lang-btn" id="langTe" onclick="setLang('te')">తెలుగు</button>
    </div>
    <div class="account-slot" id="accountSlot"></div>
  </nav>
  <main id="mainContent" class="portal">
    <h1 class="portal__title" data-en="Settings" data-te="సెట్టింగులు">Settings</h1>
    <div id="setMsg" class="auth-alert auth-alert--info" role="status" hidden></div>

    <div class="portal-two">
      <section class="portal-card" aria-labelledby="sTitle">
        <h2 id="sTitle" data-en="App settings" data-te="యాప్ సెట్టింగులు">App settings</h2>
        <form id="settingsForm" class="portal-form">
          <label class="switch"><input type="checkbox" id="stSignup"> <span data-en="Anyone can create an account" data-te="ఎవరైనా ఖాతా సృష్టించవచ్చు">Anyone can create an account</span></label>
          <label class="switch"><input type="checkbox" id="stMaint"> <span data-en="Maintenance mode (only you can use the site)" data-te="నిర్వహణ మోడ్ (మీరు మాత్రమే వాడగలరు)">Maintenance mode (only you can use the site)</span></label>
          <div class="field"><label for="stMsg" data-en="Message shown during maintenance" data-te="నిర్వహణ సమయంలో చూపే సందేశం">Message shown during maintenance</label><textarea id="stMsg" rows="2" maxlength="300"></textarea></div>
          <button type="submit" class="btn" data-en="Save settings" data-te="సెట్టింగులు భద్రపరచండి">Save settings</button>
        </form>
      </section>
      <section class="portal-card" aria-labelledby="hTitle">
        <h2 id="hTitle" data-en="System health" data-te="వ్యవస్థ స్థితి">System health</h2>
        <dl class="kv" id="system"><dt>…</dt><dd></dd></dl>
      </section>
    </div>

    <section class="portal-card" aria-labelledby="aTitle">
      <h2 id="aTitle" data-en="Admins" data-te="నిర్వాహకులు">Admins</h2>
      <p class="portal-hint" data-en="To make someone an admin, find them on the Users page and choose Make admin." data-te="ఎవరినైనా నిర్వాహకులుగా చేయడానికి, వినియోగదారుల పేజీలో వారిని వెతికి 'నిర్వాహకులుగా చేయండి' ఎంచుకోండి.">To make someone an admin, find them on the Users page and choose Make admin.</p>
      <ul class="portal-list" id="admins"><li>…</li></ul>
    </section>

    <section class="portal-card" aria-labelledby="lTitle">
      <h2 id="lTitle" data-en="Activity log" data-te="కార్యకలాపాల లాగ్">Activity log</h2>
      <div class="quick-search"><div class="field"><label for="logAction" data-en="Show" data-te="చూపించు">Show</label><select id="logAction"><option value="" data-en="Everything" data-te="అన్నీ">Everything</option></select></div></div>
      <div class="table-scroll"><table class="people-table"><thead><tr><th data-en="When" data-te="ఎప్పుడు">When</th><th data-en="Who" data-te="ఎవరు">Who</th><th data-en="What" data-te="ఏమిటి">What</th><th data-en="Details" data-te="వివరాలు">Details</th></tr></thead><tbody id="logBody"></tbody></table></div>
      <button type="button" class="btn btn--ghost" id="logMore" hidden data-en="Load more" data-te="మరిన్ని">Load more</button>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-settings.js"></script>
</body>
</html>
