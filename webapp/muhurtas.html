<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20261114c">
  <link rel="stylesheet" href="css/portal.css?v=20261113p">
  <link rel="stylesheet" href="css/muhurtas.css?v=20261119a">
  <title>All muhurtas · Gayatri Jyotirnidhi</title>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <nav class="app-shell__nav portal-nav" aria-label="Primary navigation">
    <a class="app-shell__brand" href="/"><span class="brand-mark" data-icon="sun"></span><span class="brand-text"><span class="brand-name">గాయత్రి జ్యోతిర్నిధి</span><span class="brand-tag">వేద ముహూర్త &amp; దృక్సిద్ధాంత దర్శిని</span></span></a>
    <div class="app-shell__links"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="langEn" onclick="setLang('en')">English</button>
      <button class="lang-btn" id="langTe" onclick="setLang('te')">తెలుగు</button>
    </div>
    <div class="account-slot" id="accountSlot"></div>
  </nav>
  <!-- All muhurtas (Stitch "desktop_catalog", 19 Nov 2026): every event the app knows, by category, from
       /muhurta/catalog. Each event links to the Muhurta Darshini with that event chosen. -->
  <main id="mainContent" class="portal mc">
    <header class="mc-head">
      <span class="mc-head__pill"><span data-icon="sparkle"></span> <span data-en="Every muhurta the book covers" data-te="గ్రంథంలోని అన్ని ముహూర్తాలు">Every muhurta the book covers</span></span>
      <h1 class="mc-head__title" data-en="Vedic Muhurta Nidhi" data-te="వేద ముహూర్త నిధి">Vedic Muhurta Nidhi</h1>
      <p class="mc-head__count" id="mcCount"></p>
      <label class="mc-search" for="mcSearch"><span data-icon="search"></span>
        <input type="search" id="mcSearch" autocomplete="off" placeholder="Search events (marriage, griha pravesha, namakarana…)">
      </label>
      <div class="mc-chips" id="mcChips" role="group" aria-label="Categories"></div>
    </header>
    <section class="mc-stats" id="mcStats" aria-label="At a glance"></section>
    <div id="mcMsg" class="auth-alert auth-alert--error" role="alert" hidden></div>
    <section class="mc-grid" id="mcGrid" aria-live="polite"><span class="skeleton skeleton--card" role="status" aria-label="Loading"></span></section>
    <p class="mc-none" id="mcNone" hidden data-en="No event matches that search." data-te="ఆ శోధనకు సరిపోయే కార్యం లేదు.">No event matches that search.</p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/site-config.js?v=20261114c"></script>
  <script src="js/icons.js?v=20261110"></script>
  <script src="js/app-shell.js?v=20261110"></script>
  <script src="js/i18n.js?v=20261114c"></script>
  <script src="js/auth.js?v=20261119a"></script>
  <script src="js/muhurtas.js?v=20261119a"></script>
</body>
</html>
