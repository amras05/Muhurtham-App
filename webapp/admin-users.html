<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20261121b">
  <link rel="stylesheet" href="css/portal.css?v=20261121b">
  <title>Users · Gayathri Jyothirnidhe</title>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <nav class="app-shell__nav portal-nav" aria-label="Primary navigation">
    <a class="app-shell__brand" href="/"><span class="brand-mark" data-icon="sun"></span><span class="brand-text"><span class="brand-name">గాయత్రి జ్యోతిర్నిధి</span><span class="brand-tag">వేద ముహూర్త &amp; దృక్సిద్ధాంత దర్శిని</span></span></a>
    <div class="app-shell__links"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="langEn" onclick="setLang('en')">English</button>
      <button class="lang-btn" id="langTe" onclick="setLang('te')">తెలుగు</button>
    </div>
    <div class="account-slot" id="accountSlot"></div>
  </nav>
  <main id="mainContent" class="portal">
    <h1 class="portal__title" data-i18n="Users">Users</h1>
    <div id="usersMsg" class="auth-alert auth-alert--info" role="status" hidden></div>
    <form id="filters" class="quick-search" role="search">
      <div class="field"><label for="fQ" data-i18n>Name or last digits of the mobile</label><input id="fQ" type="search" autocomplete="off"></div>
      <div class="field"><label for="fRole" data-i18n>Role</label>
        <select id="fRole"><option value="" data-i18n>All</option><option value="user" data-i18n>User</option><option value="admin" data-i18n>Admin</option><option value="super_admin" data-i18n>Super admin</option></select></div>
      <div class="field"><label for="fStatus" data-i18n>Status</label>
        <select id="fStatus"><option value="" data-i18n>All</option><option value="active" data-i18n>Active</option><option value="disabled" data-i18n>Disabled</option><option value="pending" data-i18n>Sign-up not finished</option><option value="invited" data-i18n>Invited</option><option value="locked" data-i18n>Locked out</option></select></div>
      <button type="submit" class="btn" data-i18n>Search</button>
    </form>
    <div class="users-bar">
      <p class="portal-hint" id="usersCount"></p>
      <button type="button" class="btn btn--sm" id="addPersonBtn" hidden data-i18n>Add a person</button>
    </div>
    <!-- Add a person / Edit a person (21 Nov 2026): one dialog for both. Add shows the role and the password;
         Edit shows the name, a new mobile and the language. -->
    <dialog id="personDialog" class="app-dialog person-dialog" aria-labelledby="pdTitle" aria-describedby="pdHint">
      <form id="personForm" class="person-form" method="dialog" novalidate>
        <header class="person-form__head">
          <h2 id="pdTitle" class="person-form__title"></h2>
          <button type="button" class="person-form__close" id="pdClose" aria-label="Close">&times;</button>
        </header>
        <p class="person-form__hint" id="pdHint"></p>

        <fieldset class="person-form__group" id="pdPerson">
          <legend data-i18n>Person</legend>
          <div class="pf-field"><label for="apName" data-i18n>Full name</label>
            <input id="apName" required minlength="2" maxlength="80" autocomplete="off"></div>
          <div class="pf-field"><label for="apPhone" id="pdPhoneLabel">Mobile</label>
            <input id="apPhone" inputmode="tel" maxlength="20" autocomplete="off" placeholder="98480 12345"></div>
          <div class="person-form__row">
            <div class="pf-field" id="pdRoleField"><label for="apRole" data-i18n>Role</label>
              <select id="apRole"><option value="user" data-i18n>User</option></select></div>
            <div class="pf-field"><label for="apLang" data-i18n>Language</label>
              <select id="apLang"><option value="te">తెలుగు</option><option value="en">English</option></select></div>
          </div>
        </fieldset>

        <fieldset class="person-form__group" id="pdPasswords">
          <legend data-i18n>Sign-in password</legend>
          <div class="person-form__row">
            <div class="pf-field"><label for="apPass" data-i18n>Password</label>
              <div class="pf-pass"><input id="apPass" type="password" minlength="8" maxlength="128" autocomplete="new-password" aria-describedby="pdPassHelp">
                <button type="button" class="pf-pass__toggle" data-for="apPass" aria-pressed="false" data-i18n>Show</button></div></div>
            <div class="pf-field"><label for="apPass2" data-i18n>Type it again</label>
              <div class="pf-pass"><input id="apPass2" type="password" minlength="8" maxlength="128" autocomplete="new-password">
                <button type="button" class="pf-pass__toggle" data-for="apPass2" aria-pressed="false" data-i18n>Show</button></div></div>
          </div>
          <p class="pf-help" id="pdPassHelp" data-i18n>At least 8 characters. Share it with them privately; they can change it in My account.</p>
        </fieldset>

        <div class="auth-alert auth-alert--error" id="pdError" role="alert" hidden></div>
        <footer class="person-form__actions">
          <button type="button" class="app-dialog__btn" id="apCancel" data-i18n>Cancel</button>
          <button type="submit" class="app-dialog__btn app-dialog__btn--primary" id="pdSubmit"></button>
        </footer>
      </form>
    </dialog>
    <form id="bulkBar" class="bulk-bar" hidden>
      <strong id="bulkCount"></strong>
      <input id="bulkReason" maxlength="200" placeholder="Reason for disabling" aria-label="Reason for disabling">
      <button type="button" class="btn btn--sm" data-bulk="disable" data-i18n>Disable selected</button>
      <button type="button" class="btn btn--sm btn--ghost" data-bulk="enable" data-i18n>Enable selected</button>
      <button type="button" class="linkish" data-bulk="clear" data-i18n>Clear</button>
    </form>
    <div class="table-scroll"><table class="people-table" id="peopleTable">
      <thead><tr><th><input type="checkbox" id="selAll" aria-label="Select everyone shown"></th><th data-i18n>Name</th><th data-i18n>Mobile</th><th data-i18n>Role</th><th data-i18n>Status</th><th data-i18n>Last login</th><th data-i18n>Actions</th></tr></thead>
      <tbody id="peopleBody"><tr><td colspan="7"><span class="skeleton" role="status" aria-label="Loading"></span></td></tr></tbody>
    </table></div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/site-config.js?v=20261122a"></script>
  <script src="js/icons.js?v=20261122a"></script>
  <script src="js/app-shell.js?v=20261122a"></script>
  <script src="i18n/te.js?v=20261122a"></script>
  <script src="js/i18n.js?v=20261122a"></script>
  <script src="js/auth.js?v=20261122a"></script>
  <script src="js/admin-users.js?v=20261122a"></script>
</body>
</html>
