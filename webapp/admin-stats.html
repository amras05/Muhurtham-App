<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20261121b">
  <link rel="stylesheet" href="css/portal.css?v=20261113p">
  <title>Statistics · Gayathri Jyothirnidhe</title>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <nav class="app-shell__nav portal-nav" aria-label="Primary navigation">
    <a class="app-shell__brand" href="/"><span class="brand-mark" data-icon="sun"></span><span class="brand-text"><span class="brand-name">గాయత్రి జ్యోతిర్నిధి</span><span class="brand-tag">వేద ముహూర్త &amp; దృక్సిద్ధాంత దర్శిని</span></span></a>
    <div class="app-shell__links"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="langEn" onclick="setLang('en')">English</button>
      <button class="lang-btn" id="langTe" onclick="setLang('te')">తెలుగు</button>
    </div>
    <div class="account-slot" id="accountSlot"></div>
  </nav>
  <main id="mainContent" class="portal">
    <div class="vis-bar">
      <h1 class="portal__title" data-i18n>Statistics</h1>
      <div class="field stats-range"><label for="statDays" data-i18n>Period</label>
        <select id="statDays"><option value="7" data-i18n>Last 7 days</option><option value="30" selected data-i18n>Last 30 days</option><option value="90" data-i18n>Last 90 days</option></select></div>
    </div>
    <div id="statMsg" class="auth-alert auth-alert--error" role="status" hidden></div>
    <div class="stat-grid" id="statTiles"><span class="skeleton skeleton--tile" aria-hidden="true"></span><span class="skeleton skeleton--tile" aria-hidden="true"></span><span class="skeleton skeleton--tile" aria-hidden="true"></span><span class="skeleton skeleton--tile" aria-hidden="true"></span></div>
    <div class="stats-charts" id="statCharts"></div>
    <div class="portal-two">
      <section class="portal-card" aria-labelledby="tmTitle"><h2 id="tmTitle" data-i18n>Most-searched muhurtas</h2><ol class="rank-list" id="topMuhurtas"></ol></section>
      <section class="portal-card" aria-labelledby="ttTitle"><h2 id="ttTitle" data-i18n>Searches by tab</h2><ol class="rank-list" id="topTabs"></ol></section>
    </div>
    <section class="portal-card" aria-labelledby="svTitle"><h2 id="svTitle" data-i18n>Server</h2><dl class="kv" id="statServer"></dl></section>
    <p class="portal-hint" data-i18n>Days follow India time. Counts come from the activity log, so they start from when logging began.</p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/site-config.js?v=20261122a"></script>
  <script src="js/icons.js?v=20261122a"></script>
  <script src="js/app-shell.js?v=20261122a"></script>
  <script src="i18n/te.js?v=20261122a"></script>
  <script src="js/i18n.js?v=20261122a"></script>
  <script src="js/auth.js?v=20261122a"></script>
  <script src="js/admin-stats.js?v=20261122a"></script>
</body>
</html>
