<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Muhurtham - Find Auspicious Timings for Life's Important Moments">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Apple Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muhurtham">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <title>Muhurtham — Auspicious Timing Finder</title>
  
  <!-- Google Fonts Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFF8F0;
      overflow: hidden;
    }
    
    /* Loading indicator */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #FFF8F0 0%, #FFF0D4 100%);
    }
    
    .loading-logo {
      font-family: 'Georgia', serif;
      font-size: 2.5rem;
      color: #8B1A1A;
      margin-bottom: 1rem;
      letter-spacing: 2px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #F0E0C0;
      border-top: 3px solid #D4A017;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="loading-logo">✦ Muhurtham ✦</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    window.addEventListener('load', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.transition = 'opacity 0.5s';
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 500);
      }
    });
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
