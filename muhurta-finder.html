<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhurta Finder · 30-Day Panchang Scanner</title>
  <meta name="description" content="Find auspicious Muhurta windows across 30 days with Pushkara Bhaga, Lagna Shuddhi, and Ashtama Shuddhi analysis.">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/muhurta-finder.css">
</head>

<body>
  <div class="wrap">
    <header>
      <div class="eyebrow" data-en="30-Day Muhurta Scanner" data-te="30 రోజుల ముహూర్త శోధన">30-Day Muhurta Scanner</div>
      <h1 style="font-family: 'Outfit', 'Noto Sans Telugu', Georgia, serif; font-size: 30px; margin: 4px 0 0 0;">
        ముహూర్త శోధన · Muhurta Finder</h1>
      <p data-en="Scan 30 days of Panchang with Pushkara Bhaga, Lagna Shuddhi & Ashtama Shuddhi analysis"
        data-te="పుష్కర భాగ, లగ్న శుద్ధి & అష్టమ శుద్ధి విశ్లేషణతో 30 రోజుల పంచాంగం శోధన">
        Scan 30 days of Panchang with Pushkara Bhaga, Lagna Shuddhi & Ashtama Shuddhi analysis
      </p>
    </header>

    <div class="lang-toggle">
      <button class="lang-btn active" id="langEn" onclick="setLang('en')">English</button>
      <button class="lang-btn" id="langTe" onclick="setLang('te')">తెలుగు</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs no-print">
      <a href="panchang-lookup.html" class="nav-tab" data-en="Panchangam" data-te="పంచాంగం">Panchangam</a>
      <a href="panchang-lookup.html#namakarana" class="nav-tab" data-en="Namakarana" data-te="నామకరణం">Namakarana</a>
      <button class="nav-tab active" data-en="Muhurta Finder" data-te="ముహూర్త శోధన">Muhurta Finder</button>
    </div>

    <!-- Input Form -->
    <div class="controls">
      <div class="field" style="flex: 1; min-width: 140px;">
        <label for="startDate" data-en="Start Date" data-te="ప్రారంభ తేదీ">Start Date</label>
        <input type="date" id="startDate">
      </div>
      <div class="field" style="flex: 1; min-width: 180px;">
        <label for="mfRegionSelect" data-en="Location" data-te="ప్రాంతం">Location</label>
        <select id="mfRegionSelect"></select>
      </div>
      <div class="field" style="flex: 0.5; min-width: 80px;">
        <label for="daysInput" data-en="Days" data-te="రోజులు">Days</label>
        <input type="number" id="daysInput" value="30" min="1" max="60">
      </div>

      <!-- Optional birth details (collapsible) -->
      <div style="flex: 0 0 100%; margin-top: 6px;">
        <button type="button" id="toggleBirthDetails" onclick="toggleBirth()"
          style="padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px dashed var(--line); border-radius: 6px; background: #fffdf5; color: #8a7f68; font-family: inherit;">
          ➕ <span data-en="Add Birth Details (for Tarabalam / Ashtama checks)" data-te="జన్మ వివరాలు జోడించండి (తారాబలం / అష్టమ తనిఖీ కోసం)">Add Birth Details (for Tarabalam / Ashtama checks)</span>
        </button>
      </div>

      <div id="birthDetailsSection" style="display: none; flex: 0 0 100%; margin-top: 8px; padding-top: 12px; border-top: 1px dashed var(--line);">
        <div style="display: flex; flex-wrap: wrap; gap: 14px;">
          <div class="field" style="flex: 1; min-width: 140px;">
            <label for="mfBirthDob" data-en="Birth Date" data-te="పుట్టిన తేదీ">Birth Date</label>
            <input type="date" id="mfBirthDob">
          </div>
          <div class="field" style="flex: 1; min-width: 100px;">
            <label for="mfBirthTob" data-en="Birth Time" data-te="పుట్టిన సమయం">Birth Time</label>
            <input type="time" id="mfBirthTob" value="12:00">
          </div>
        </div>
      </div>

      <!-- Custom place search -->
      <div id="mfCustomPlaceField"
        style="display:none; flex: 0 0 100%; margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; width: 100%;">
        <label for="mfCustomPlaceInput"
          style="display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a7f68; margin-bottom: 6px;"
          data-en="Search Place (e.g. London, Kakinada)" data-te="ప్రాంతం పేరు (ఉదా: లండన్, కాకినాడ)">Search Place</label>
        <div style="display:flex; gap: 8px; position: relative;">
          <input type="text" id="mfCustomPlaceInput" placeholder="Enter place name..." autocomplete="off"
            style="flex: 1; padding: 9px 10px; font-size: 15px; border: 1px solid var(--line); border-radius: 6px; background: var(--card-bg); color: var(--ink);">
          <button id="mfSearchPlaceBtn"
            style="width:auto; padding: 0 20px; background:var(--marigold); color:white; font-weight:600; border:none; border-radius:6px; cursor:pointer;"
            data-en="Search & Go" data-te="వెతకండి">Search & Go</button>
          <div id="mfSuggestionsList" class="suggestions-container"
            style="display:none; position:absolute; top: 100%; left:0; right: 120px; width: calc(100% - 130px);">
          </div>
        </div>
      </div>

      <button id="findBtn" data-en="🔍 Scan 30 Days for Muhurtas" data-te="🔍 30 రోజుల ముహూర్త శోధన">🔍 Scan 30 Days for Muhurtas</button>
    </div>

    <!-- Progress -->
    <div id="progressSection" style="display: none;">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%;"></div></div>
      <div class="status" id="progressText">Scanning...</div>
    </div>

    <div class="status" id="mfStatus"></div>

    <!-- Results -->
    <div id="mfResults" style="display: none;">
      <!-- Summary Bar -->
      <div class="summary-bar" id="summaryBar"></div>

      <!-- Day Cards -->
      <div class="day-grid" id="dayGrid"></div>
    </div>
  </div>

  <!-- Modal -->
  <div id="mfModal" class="modal-overlay" style="display:none;" onclick="if(event.target === this) closeModal()">
    <div class="modal-content">
      <div class="modal-header">
        <div id="mfModalTitle" class="modal-title"></div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button class="no-print" onclick="window.print()" style="background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 700;">🖨️ <span data-en="Print PDF" data-te="ప్రింట్ PDF">Print PDF</span></button>
          <button class="modal-close no-print" onclick="closeModal()">&times;</button>
        </div>
      </div>
      <div class="modal-body" id="mfModalBody"></div>
    </div>
  </div>

  <!-- Components (plain scripts: file:// compatible → no ES modules) -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/regions.js"></script>
  <script src="js/finder.js"></script>
</body>

</html>
