title_en: "Return Journey (Tirugu Prayanam)"
title_te: "తిరుగు ప్రయాణము"
description_en: "Coming back home: the journey rules, plus Mercury not facing you or combust, and the Vrishabha chakra."
description_te: "ఇంటికి తిరుగు ప్రయాణం: ప్రయాణ నియమాలతో పాటు బుధ సమ్ముఖం, బుధ మౌఢ్యం, వృషభ చక్రం."
tab_inputs: [travel]
source:
  part: 5
  section: "తిరుగు ప్రయాణమునకు శుభకాలము"
  notes: >-
    Added 12 Nov 2026 from the book p.144 (return journey) on top of the Prayana rules (Plan M18).
    Give the direction of home as the travel direction. Venus and Mercury must not face the
    traveller and Mercury must not be combust; the Vrishabha chakra (p.162) applies. Mars facing
    and "Venus on the south side is good" are not modelled yet.
