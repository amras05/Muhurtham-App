id: upanayana
category: samskaras
tab: upanayana
title_en: "Upanayana (Sacred Thread Ceremony)"
title_te: "ఉపనయనము (వటువు బ్రహ్మోపదేశము)"
description_en: "Years 5 to 9 (10 and 11 if needed), Uttarayana, forenoon. Tarabala for the vatu, parents and guru."
description_te: "5 నుండి 9 సంవత్సరాలు (అవసరమైతే 10, 11), ఉత్తరాయణం, పూర్వాహ్ణం."
tab_inputs: [samskara_child, upanayana_family]
source:
  part: 5
  section: "ఉపనయనము"
  notes: >-
    Plan M15 17.1. Kendra afflictions (Sun, Mars, Saturn, Rahu, Ketu in a kendra) reject the
    window (Strict). Not yet modelled: varna-specific years and seasons, anadhyaya days,
    Moon-sign preference, varna and Veda-lord planetary strength.
hard_filters:
  common: {mahadoshas_21: true, panchaka_rahita: true, masa_shubha: true}
  # Years 5-9; 10 and 11 only if needed (book para 1914). With no birth date, or no muhurta in either,
  # muhurtas are shown regardless of age, marked (11 Nov 2026).
  age_rule: {reference: birth, unit: years, allowed: [5, 6, 7, 8, 9], fallback: [10, 11]}
  time_of_day: forenoon
  # Varnesha, vedadhipati and Guru bala for the vatu (classical lords; author to confirm)
  upanayana_strength: true
  # Anadhyaya days, sankranti anadhyaya and trishtakas (book paras 1994-2004, 1916)
  anadhyaya: true
  # Doshapavada for the upanayana lagna (book paras 1972-78)
  doshapavada: true
  vaara_exclude: [tuesday, saturday]
  tithi_exclude: [pratipada, chaturthi, shashti, ashtami, navami, ekadashi, dwadashi, chaturdashi, purnima, amavasya]
  karana_exclude: [bhadra]
  nakshatra_allow: [anuradha, revati, ashwini, mrigashira, uttara_phalguni, uttara_ashadha, uttara_bhadrapada, punarvasu, pushya, shravana, dhanishta, shatabhisha, hasta, chitra, swati, rohini]
  exclude_janma_counts: [1, 7, 10, 16, 18, 23, 25]
  sun_sign_allow: [makara, kumbha, meena, mesha, vrishabha, mithuna]
  tarabala_for: [father, mother, guru]
  house_rules:
    - house: 8
      planets: none
  planet_rules:
    - planet: moon
      not_in_houses: [1]
    - planet: sun
      not_in_houses: [1, 4, 7, 10]
      note: "sphujita: danger to the father"
    - planet: mars
      not_in_houses: [1, 4, 7, 10]
      note: "danger to the mother"
    - planet: saturn
      not_in_houses: [1, 4, 7, 10]
      note: "danger to gotra relatives"
    - planet: rahu
      not_in_houses: [1, 4, 7, 10]
      note: "danger to the vatu"
    - planet: ketu
      not_in_houses: [1, 4, 7, 10]
      note: "danger to the father"
    - planet: sun
      in_houses: [11]
      soft_points: 3
      note: "Sun in the 11th cancels faults"
soft_scoring:
  vaara_weights: {wednesday: 3, thursday: 3, friday: 3, sunday: 1, monday: 1}
