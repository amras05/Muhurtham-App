    - swati
    - anuradha
    - uttara_ashadha     # Restored from damaged OCR text
    - shravana
    - dhanishta
    - shatabhisha
    - uttara_bhadrapada
    - revati

  house_rules:
    - house: 8
      planets: none
    - house: 1
      planets: no_malefics

