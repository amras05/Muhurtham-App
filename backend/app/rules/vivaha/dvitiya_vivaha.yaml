title_te: "ద్వితీయ వివాహము"
description_en: "A second marriage: the wedding rules, with Monday counted as good (book p.127-129)."
description_te: "ద్వితీయ వివాహం: వివాహ నియమాలతో, సోమవారం అనుకూలం (గ్రంథం పేజీ 127-129)."
tab_inputs: [vivaha_couple]
source:
  part: 5
  section: "వివాహ ప్రకరణము"
  page: "Part 5, Section 2"
  notes: >-
    Added 12 Nov 2026 from the book p.127-129 on top of the Vivaha rules. Monday is good for a
    second marriage (p.129), so it scores +3 here instead of -2. Not modelled yet: the year rule
    (p.127-128) - in odd years counted from the first marriage while the first wife lives, or from
    the year before her death - because the app does not ask for those dates yet.
