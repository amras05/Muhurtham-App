# One rule record per dosha (plan B2): the 21 mahadoshas and the 10 dashavidha doshas the
# audit checks for every muhurta window. The engine (engines/doshas.py) does the judging; this
# file says what each check is, where it applies, what it needs, and where the book gives it.
#
#   id        the engine's dosha id (each audit row carries it; the loader warns on a mismatch)
#   scope     where it applies
#   severity  fatal = never allowed (Dr. Nemani, 9 Nov 2026: all 21 mahadoshas, every event);
#             dashavidha = blocks marriage, shown as information elsewhere, and is excepted when
#             Jupiter is in the muhurta lagna
#   inputs    what the check reads
#   book_id   stable id for the book passage; provisional until B3 maps main.docx
#   status    evaluated | needs_person (needs a person's janma details) | to_confirm (shown, does
#             not block, until the author confirms) | awaiting_author (the book's data is missing)
#   question  the question number in the questionnaire for Dr. Nemani, where one is open
#
# Events that switch the 21 off entirely (mahadoshas_21: false in their rule file): asthisanchayana,
# abhyanga, sapindikarana, nutana_vadhu_pravesha, demolition.

mahadoshas:
  - {number: 1, id: panchanga_shuddhi_heenamu, name_en: Panchanga Shuddhi-hina, name_te: పంచాంగ శుద్ధిహీనము,
     scope: all events, severity: fatal, status: evaluated, book_id: P2-MD-01,
     inputs: "the event's tithi, vara, nakshatra, yoga and karana rules; the day's panchang"}
