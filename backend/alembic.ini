# Alembic migrations for Muhurtham (PostgreSQL). Run from backend/:
#   alembic upgrade head        apply migrations (migration owner only)
#   alembic upgrade head --sql  print the SQL without touching the database
#   alembic current             show the applied version
# The connection comes from MUHURTHAM_DB_* (backend/.env), using the migrate role.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
