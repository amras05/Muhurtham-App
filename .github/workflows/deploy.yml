name: Deploy to Hetzner (Native)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure team pushes are deployed sequentially without race conditions
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER || 'deploy' }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true
          script: |
            echo "==> Deploying commit ${{ github.sha }} by ${{ github.actor }}..."
            cd /var/www/muhurtham
            
            # 1. Fetch and align to latest main cleanly without merge conflicts
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Update dependencies in native virtual environment
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r backend/requirements.txt
            
            # 3. Ensure Swiss Ephemeris data files are installed
            bash backend/install_ephemeris.sh
            
            # 4. Update systemd service definition if changed
            sudo cp deploy/muhurtham.service /etc/systemd/system/muhurtham.service
            sudo systemctl daemon-reload
            
            # 4b. Back up the database, then apply migrations (plan R7). script_stop stops the
            #     deploy (and the restart) if either fails, so the old app keeps running.
            if [ -f /etc/muhurtham.env ]; then
              bash deploy/backup.sh
              set -a; . /etc/muhurtham.env; set +a
              (cd backend && ../.venv/bin/alembic upgrade head)
            else
              echo "==> /etc/muhurtham.env missing: skipping backup and migrations (see deploy/RUNBOOK.md)"
            fi

            # 5. Reload reverse proxy config if changed
            if [ -f "deploy/Caddyfile" ]; then
              sudo cp deploy/Caddyfile /etc/caddy/Caddyfile
              sudo systemctl reload caddy || true
            fi
            
            # 6. Restart the application service
            sudo systemctl restart muhurtham
            
            # 7. Verify health endpoint
            sleep 2
            if curl -f http://127.0.0.1:8000/health; then
              echo ""
              echo "==> [SUCCESS] Deployment healthy! Commit ${{ github.sha }} is live."
            else
              echo "==> [ERROR] Health check failed after deployment!"
              sudo journalctl -u muhurtham -n 30 --no-pager
              exit 1
            fi
